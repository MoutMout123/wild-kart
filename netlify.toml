# Site Netlify de Wild Kart : le jeu + le serveur des comptes
[build]
  base = "netlify"
  publish = "site"
  command = "echo Wild Kart"
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- ."

[functions]
  directory = "functions"

[[headers]]
  for = "/version.json"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Cache-Control = "no-store"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
