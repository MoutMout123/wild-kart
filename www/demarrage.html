<!doctype html>
<html lang="fr">
<head>
<meta http-equiv="Content-Security-Policy" content="script-src 'self'">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Wild Kart – écran de chargement</title>
<style>
*{box-sizing:border-box}
:root{color-scheme:dark;--bg0:#030719;--bg1:#0c1c50;--accent:#19b8ff}
html,body{width:100%;height:100%;margin:0;overflow:hidden;overscroll-behavior:none}
body{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:#030719;color:#fff;-webkit-tap-highlight-color:transparent}
.phone{position:relative;width:100%;height:100vh;height:100dvh;min-height:370px;overflow:hidden;
  background:radial-gradient(ellipse 78% 44% at 50% 45%,#133375 0%,#081940 43%,#030719 100%);isolation:isolate}
.phone:before{content:"";position:absolute;inset:0;z-index:-1;pointer-events:none;opacity:.65;
  background:linear-gradient(to bottom,rgba(53,108,247,.08),transparent 27%,transparent 74%,rgba(28,106,239,.12)),
  repeating-linear-gradient(0deg,transparent 0px,transparent 56px,rgba(98,160,255,.025) 57px,transparent 58px)}
.phone:after{content:"";position:absolute;inset:0;pointer-events:none;z-index:-1;
  background:radial-gradient(ellipse at 50% 50%,transparent 20%,rgba(2,4,18,.48) 100%)}
.topline{position:absolute;top:calc(21px + env(safe-area-inset-top,0px));left:clamp(20px,5vw,48px);right:clamp(20px,5vw,48px);
  display:flex;align-items:center;justify-content:space-between;gap:12px;z-index:2;
  color:#90b9f2;font-weight:800;font-size:clamp(9px,2.5vw,12px);letter-spacing:.2em}
.topline .live{display:inline-flex;align-items:center;gap:9px}
.topline .live:before{content:"";width:7px;height:7px;border-radius:50%;background:#35caff;
  box-shadow:0 0 0 5px rgba(40,176,255,.13),0 0 18px #35caff}
.stage{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;
  transform:translateY(-2.6dvh)}
#s{display:block;width:min(99vw,800px);height:auto;max-height:min(75dvh,780px);aspect-ratio:21/20;
  overflow:visible;flex:none;shape-rendering:geometricPrecision}
.hud{position:absolute;z-index:2;bottom:calc(clamp(105px,14dvh,175px) + env(safe-area-inset-bottom,0px));
  left:clamp(22px,7vw,85px);right:clamp(22px,7vw,85px);max-width:620px;margin-inline:auto;pointer-events:none}
.hud-row{display:flex;align-items:center;justify-content:space-between;gap:12px;
  font-size:clamp(10px,2.7vw,13px);font-weight:800;letter-spacing:.17em;color:#b7dcff}
.hud-percent{font-variant-numeric:tabular-nums;color:#fff;min-width:58px;text-align:right}
.progress{height:7px;background:#091639;border:1px solid #23588e;border-radius:999px;margin-top:12px;overflow:hidden;
  box-shadow:inset 0 0 8px #030815,0 0 18px rgba(43,147,255,.08)}
.progress-fill{height:100%;width:0%;background:linear-gradient(90deg,#17baff,#6380ff);border-radius:inherit;
  box-shadow:0 0 12px #3caeff;transition:width 80ms linear}
.hud-sub{margin-top:10px;text-align:center;color:#648ac3;letter-spacing:.22em;font-size:10px;font-weight:700}
.preview{position:absolute;z-index:5;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);
  display:flex;align-items:center;justify-content:center;gap:7px;white-space:nowrap}
.preview button{font:700 11px/1 system-ui,sans-serif;letter-spacing:.02em;color:#91c7ff;
  background:rgba(7,23,57,.88);border:1px solid #2a5487;border-radius:999px;
  min-height:42px;padding:0 14px;cursor:pointer;touch-action:manipulation;white-space:nowrap}
.preview button:hover,.preview button:focus-visible{color:white;border-color:#59d1ff;outline:none}
.preview button[aria-pressed=true]{color:#031027;background:linear-gradient(90deg,#51ccff,#5d9dff);border-color:#6dceff}
.preview .re{font-size:21px;padding:0;width:42px;flex:none}
#blackout{position:absolute;inset:0;z-index:4;background:black;opacity:0;pointer-events:none}
#bam{paint-order:stroke;stroke:#020818;stroke-width:8px;letter-spacing:3px}
#pc{display:none}
@media(max-width:600px){#rl>use:first-child{filter:none;opacity:.28}#kart>g[filter]{display:none}}
@media(max-height:650px){.stage{transform:translateY(-4dvh)}#s{max-height:67dvh}.hud{bottom:calc(85px + env(safe-area-inset-bottom,0px))}}
@media(min-aspect-ratio:1/1){.stage{transform:none}#s{width:auto;max-width:75vw;max-height:75dvh}.hud{bottom:calc(12px + env(safe-area-inset-bottom,0px));width:45%}.preview{bottom:calc(20px + env(safe-area-inset-bottom,0px));left:auto;right:15px;transform:none}}
@media(prefers-reduced-motion:reduce){.progress-fill{transition:none}}
.ft{font-family:'Arial Black',Impact,system-ui,sans-serif;font-size:205px}
.dash{fill:none;stroke:#e6f0ff;stroke-width:2.5;stroke-linecap:round;stroke-dasharray:10 9;opacity:.85;animation:dm .7s linear infinite}
@keyframes dm{to{stroke-dashoffset:19}}
.lt,.pp{transform-box:fill-box;transform-origin:50% 100%}
.lt{opacity:0}
.play .lt{animation:drop .7s cubic-bezier(.2,.9,.3,1.3) both;animation-delay:calc(.45s + var(--i)*.1s)}
@keyframes drop{from{transform:translateY(-70px) scale(.7);opacity:0}to{transform:none;opacity:1}}
.lw{opacity:clamp(0,calc(var(--lw,0)*1.7 - var(--j)*.2),1)}
.lk{opacity:clamp(0,calc(var(--lk,0)*1.7 - var(--j)*.2),1)}
.done .pp{animation:pop .7s calc(var(--i)*.08s) both}
@keyframes pop{40%{filter:brightness(1.8);transform:scale(1.07)}}
.fin{opacity:0}.play .fin{animation:fd .5s 1.5s both}
@keyframes fd{from{opacity:0}to{opacity:1}}
.sl{opacity:0;transform-box:fill-box;transform-origin:100% 50%}
.play .sl{animation:sl 1.4s ease-out infinite}
@keyframes sl{0%{transform:scaleX(0);opacity:0}25%{opacity:.85}60%{transform:scaleX(1);opacity:.85}100%{transform:translateX(-26px) scaleX(1);opacity:0}}
.sw{animation:sw 3.4s ease-in-out infinite}
@keyframes sw{0%,55%{transform:translateX(-120px) skewX(-20deg)}100%{transform:translateX(640px) skewX(-20deg)}}
.wv{animation:wv 1.4s linear infinite}
@keyframes wv{to{transform:translateX(-40px)}}
.bb{animation:bb 1.8s ease-in infinite}
@keyframes bb{0%{transform:translateY(0);opacity:0}20%{opacity:.9}100%{transform:translateY(-40px);opacity:0}}
.bg{animation:bg 1.6s ease-in-out infinite alternate}
@keyframes bg{from{opacity:.25}to{opacity:.8}}
.rb{animation:rp 2s ease-in-out infinite alternate}
@keyframes rp{from{opacity:.8}to{opacity:1}}
@media (prefers-reduced-motion:reduce){.dash,.sl,.sw,.wv,.bb,.bg,.rb{animation:none!important}}
</style>
</head>
<body>

</g></g></g>
</g></g>
