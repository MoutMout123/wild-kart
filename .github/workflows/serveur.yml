name: Serveur Cloudflare
# Envoie le serveur Wild Kart sur Cloudflare Workers (gratuit).
# Par défaut : serveur de TEST. Un commit avec « [prod] » dans le message envoie le vrai serveur.
on:
  push:
    branches: [main]
    paths: ['worker/**', '.github/workflows/serveur.yml']
  workflow_dispatch:
    inputs:
      cible:
        description: 'test ou prod'
        default: 'test'
permissions:
  contents: write
jobs:
  envoyer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Installer
        working-directory: worker
        run: npm install --no-audit --no-fund
      - name: Envoyer sur Cloudflare
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          WRANGLER_SEND_METRICS: 'false'
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then echo "::error::Ajoute le secret CLOUDFLARE_API_TOKEN"; exit 1; fi
          CIBLE="${{ github.event.inputs.cible }}"; [ -z "$CIBLE" ] && CIBLE=test
          if git log -1 --pretty=%B | grep -q '\[prod\]'; then CIBLE=prod; fi
          if [ "$CIBLE" = prod ]; then NAME=wild-kart-serveur; DB=wild-kart; else NAME=wild-kart-serveur-test; DB=wild-kart-test; fi
          echo "Cible : $CIBLE ($NAME)"
          npx wrangler d1 create "$DB" || true
          npx wrangler d1 list --json > d1.json
          ID=$(node -e "const l=JSON.parse(require('fs').readFileSync('d1.json','utf8'));const d=l.find(x=>x.name===process.argv[1]);console.log(d?(d.uuid||d.id||''):'')" "$DB")
          if [ -z "$ID" ]; then echo "::error::Base D1 introuvable"; cat d1.json; exit 1; fi
          cat > wrangler.toml <<TOML
          name = "$NAME"
          main = "index.mjs"
          compatibility_date = "2026-09-15"
          compatibility_flags = ["nodejs_compat"]
          workers_dev = true
          [vars]
          OLD_API = "https://wild-kart-moutmout.netlify.app/api/compte"
          [[d1_databases]]
          binding = "DB"
          database_name = "$DB"
          database_id = "$ID"
          TOML
          sed -i 's/^          //' wrangler.toml
          npx wrangler deploy 2>&1 | tee deploy.log
          URL=$(grep -o 'https://[a-zA-Z0-9.-]*workers\.dev' deploy.log | head -1)
          if [ -z "$URL" ]; then echo "::error::Adresse du serveur introuvable (sous-domaine workers.dev à créer ?)"; exit 1; fi
          echo "$URL" > "url-$CIBLE.txt"
          curl -s -X POST "$URL/api/compte" -d '{"a":"fid","fid":"TEST-1234"}' | tee essai.txt
          grep -q '"ok":true' essai.txt || { echo "::error::Le serveur ne répond pas correctement"; exit 1; }
          cd ..; git config user.name "github-actions"; git config user.email "github-actions@users.noreply.github.com"
          git add "worker/url-$CIBLE.txt"; git commit -m "Adresse du serveur $CIBLE [skip ci]" || true; git pull --rebase && git push
