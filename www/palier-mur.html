    // Pose du kart : repère de surface (attaché) ou orientation de vol (détaché)
    let p, t, n;
    if (k.attache) { const f = k.surf.repere(k.s); p = v3(k.surf.sample(k.s, k.d, 0)); const dir = v3(S.V.add(S.V.mul(f.t, Math.cos(k.cap)), S.V.mul(f.l, Math.sin(k.cap)))); t = dir; n = v3(f.n); }
    else { p = v3(k.vol.p); t = v3(k.vol.v).normalize(); n = new T.Vector3(0, 1, 0).sub(t.clone().multiplyScalar(t.y)).normalize(); }
    const l = new T.Vector3().crossVectors(n, t).normalize(), m = new T.Matrix4().makeBasis(t, n, l.clone().negate()); kartG.position.copy(p); kartG.quaternion.setFromRotationMatrix(m); if (k.etourdi > 0) kartG.rotateY(k.etourdi * 12);   /* tête-à-queue visible */
    fN.position.copy(p); fN.setDirection(n); fT.position.copy(p); fT.setDirection(t); fL.position.copy(p); fL.setDirection(l);
    if (nTraj < 2000 && (nTraj === 0 || p.distanceTo(new T.Vector3(trajP[3 * nTraj - 3], trajP[3 * nTraj - 2], trajP[3 * nTraj - 1])) > .8)) { trajP.set([p.x, p.y + .05, p.z], 3 * nTraj); nTraj++; trajG.setDrawRange(0, nTraj); trajG.attributes.position.needsUpdate = true; }
    // Caméra : pilote = derrière le kart dans son repère (le « haut » mêle la normale et la verticale du monde selon « horizon » : à 25 % le mur paraissait une route plate, comme signalé sur Aurores) ; oblique = vue extérieure fixe.
    if (camMode === 'pilote') {
      // Orientation de caméra = mélange (quaternions) entre le repère de la chaussée (t, n) et un repère À NIVEAU (cap horizontal, verticale
      // du monde) selon « horizon ». En montée frontale, la caméra reste ainsi en retrait et plus bas : on voit le mur se dresser.
      const th = new T.Vector3(t.x, 0, t.z); if (th.lengthSq() < 1e-4) th.copy(capNiveau); else { th.normalize(); capNiveau.copy(th); }
      const base = (fw, up) => { const lt = new T.Vector3().crossVectors(up, fw).normalize(), u2 = new T.Vector3().crossVectors(fw, lt).normalize(); return new T.Quaternion().setFromRotationMatrix(new T.Matrix4().makeBasis(lt.clone().negate(), u2, fw.clone().negate())); };
      const q = base(t, n).slerp(base(th, new T.Vector3(0, 1, 0)), horizon), fw = new T.Vector3(0, 0, -1).applyQuaternion(q), up = new T.Vector3(0, 1, 0).applyQuaternion(q);
      const cible = p.clone().add(fw.clone().multiplyScalar(-7.5)).add(up.clone().multiplyScalar(2.8)); camPos.lerp(cible, .2); camHaut.lerp(up, .2);
      cam.position.copy(camPos); cam.up.copy(camHaut); cam.lookAt(p.clone().add(fw.clone().multiplyScalar(6)).add(up.clone().multiplyScalar(.6))); }
    else if (profil === 'mur') { cam.position.set(72, 30, 62); cam.up.set(0, 1, 0); cam.lookAt(p.x * .4 + 60 * .6, p.y * .5 + 15, 0); }
    else if (RESEAUX.includes(profil)) { /* étages : vue de côté, basse (9 m), qui suit le kart — les hauteurs se lisent */
      const th = new T.Vector3(t.x, 0, t.z); if (th.lengthSq() < 1e-4) th.copy(capNiveau); else th.normalize(); const cote = new T.Vector3(-th.z, 0, th.x);
      cam.position.copy(p).addScaledVector(th, -14).addScaledVector(cote, 26).setY(p.y + 9); cam.up.set(0, 1, 0); cam.lookAt(p.x + th.x * 10, p.y, p.z + th.z * 10); }
    else { cam.position.set(p.x + 30, p.y + 38, p.z + 30); cam.up.set(0, 1, 0); cam.lookAt(p); } /* virages : vue plongeante qui suit le kart */
    R.render(sc, cam); etat.images++;
    const raide = k.raide != null ? k.raide : 0;
    document.getElementById('hud').innerHTML = '<b>' + Math.round(Math.abs(k.v) * 3.6) + ' km/h</b> · ' + cc + '<br>chaussée : ' + raide.toFixed(0) + '° ' + (k.surf.aimante(k.s) ? '(aimantée)' : '') + (RESEAUX.includes(profil) ? ' · surface ' + RS.id(k.surf) : '') + (SC.fourche || SC.reglages ? ' · vise ' + (choix > 0 ? 'gauche' : 'droite') : '') + (SC.points ? '<br>points de passage ' + (k.point || 0) + '/' + SC.points.length + ' · IA : branche ' + (choix > 0 ? 'courte' : 'longue') + ' · progression ' + RS.progression(k).toFixed(0) + ' m' : '') + '<br>' + (k.attache ? 'roues au contact' : 'EN VOL') +
      ' · détachements ' + k.detachements + ' · coups reçus ' + (k.coups || 0) + ' · rival touché ' + ((rival && rival.coups) || 0) + (k.remises ? ' · remises ' + k.remises : '') + '<br>s = ' + k.s.toFixed(0) + ' / ' + k.surf.longueur.toFixed(0) + ' m · écart ' + k.d.toFixed(1) + ' m';
    requestAnimationFrame(boucle);
  }
  requestAnimationFrame(boucle);
})();
