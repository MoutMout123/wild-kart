name: Bots de test
# Des bots jouent tout seuls au jeu (avec le serveur de test) et vérifient les fonctions.
# Seulement à la demande (Actions > Bots de test > Run workflow) : jamais tout seuls.
# 6 groupes sur 6 machines en même temps (~3 min), puis un rapport commun.
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: bots
  cancel-in-progress: true
jobs:
  bots:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        groupe: [serveur, course, fantome, garage, defi, ligne]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Installer le navigateur des bots
        run: |
          npm init -y >/dev/null
          npm install --no-audit --no-fund --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Les bots jouent (${{ matrix.groupe }})
        run: GROUP=${{ matrix.groupe }} node scripts/bots.cjs
      - name: Captures d'écran et rapport
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bots-${{ matrix.groupe }}
          path: test-results/
  rapport:
    needs: bots
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: res
      - name: Rapport commun
        run: |
          { echo "# Bots de test Wild Kart"; echo; echo "| | Test | Détail |"; echo "|---|---|---|"; cat res/*/rapport-*.md 2>/dev/null | grep '^| [✅❌]' | awk '!(/démarrage sans erreur/ && s++)'; } > rapport.md
          OK=$(grep -c '^| ✅' rapport.md || true); KO=$(grep -c '^| ❌' rapport.md || true)
          sed -i "2i $OK réussis, $KO en échec" rapport.md; cat rapport.md >> "$GITHUB_STEP_SUMMARY"; cat rapport.md
          [ "$KO" = 0 ] && [ "$OK" -gt 0 ]
