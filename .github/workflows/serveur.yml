name: Serveur Cloudflare
# Envoie le serveur Wild Kart sur Cloudflare Workers (gratuit).
# Par défaut : serveur de TEST. Un commit avec « [prod] » dans le message envoie le vrai serveur.
on:
  push:
    branches: [main]
    paths: ['worker/**', '.github/workflows/serveur.yml']
  workflow_dispatch:
    inputs:
      cible:
        description: 'test ou prod'
        default: 'test'
permissions:
  contents: write
# un seul envoi à la fois (test et vrai serveur à la suite, jamais en même temps)
concurrency:
  group: serveur-cloudflare
  cancel-in-progress: false
jobs:
  envoyer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Installer
        working-directory: worker
        run: npm install --no-audit --no-fund
      - name: Envoyer sur Cloudflare
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          WRANGLER_SEND_METRICS: 'false'
          CF_TURN_ID: ${{ secrets.CF_TURN_ID }}
          CF_TURN_TOKEN: ${{ secrets.CF_TURN_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then echo "::error::Ajoute le secret CLOUDFLARE_API_TOKEN"; exit 1; fi
          CIBLE="${{ github.event.inputs.cible }}"; [ -z "$CIBLE" ] && CIBLE=test
          if git log -1 --pretty=%B | grep -q '\[prod\]'; then CIBLE=prod; fi
          if [ "$CIBLE" = prod ]; then NAME=wild-kart-serveur; DB=wild-kart; else NAME=wild-kart-serveur-test; DB=wild-kart-test; fi
          echo "Cible : $CIBLE ($NAME)"
          npx wrangler d1 create "$DB" || true
          npx wrangler d1 list --json > d1.json
          ID=$(node -e "const l=JSON.parse(require('fs').readFileSync('d1.json','utf8'));const d=l.find(x=>x.name===process.argv[1]);console.log(d?(d.uuid||d.id||''):'')" "$DB")
          if [ -z "$ID" ]; then echo "::error::Base D1 introuvable"; cat d1.json; exit 1; fi
          cat > wrangler.toml <<TOML
          name = "$NAME"
          main = "index.mjs"
          compatibility_date = "2026-09-15"
          compatibility_flags = ["nodejs_compat"]
          workers_dev = true
          [vars]
          OLD_API = "https://wild-kart-moutmout.netlify.app/api/compte"
          TEST_MODE = "$( [ "$CIBLE" = test ] && echo 1 || echo 0 )"
          [[d1_databases]]
          binding = "DB"
          database_name = "$DB"
          database_id = "$ID"
          TOML
          sed -i 's/^          //' wrangler.toml
          npx wrangler deploy 2>&1 | tee deploy.log
          # clés du relais TURN (pour jouer entre réseaux différents)
          if [ -n "$CF_TURN_ID" ] && [ -n "$CF_TURN_TOKEN" ]; then printf '%s' "$CF_TURN_ID" | npx wrangler secret put TURN_ID; printf '%s' "$CF_TURN_TOKEN" | npx wrangler secret put TURN_TOKEN; echo "relais TURN : oui" > turn.txt; else echo "relais TURN : pas de clé" > turn.txt; fi
          URL=$(grep -o 'https://[a-zA-Z0-9.-]*workers\.dev' deploy.log | head -1)
          if [ -z "$URL" ]; then echo "::error::Adresse du serveur introuvable (sous-domaine workers.dev à créer ?)"; exit 1; fi
          echo "$URL" > "url-$CIBLE.txt"
          OK=0; for i in $(seq 1 15); do curl -s -m 10 -X POST "$URL/api/compte" -d '{"a":"fid","fid":"TEST-1234"}' > essai.txt || true; if grep -q '"ok":true' essai.txt; then OK=1; break; fi; sleep 6; done
          OK_ICE=$(curl -s -m 10 -X POST "$URL/api/compte" -d '{"a":"ice"}' | grep -c 'turn:' || true)
          # essai d'une vraie mise en relation (partie créée -> invité -> message reçu), puis nettoyage
          SIG=$(node -e "const U=process.argv[1]+'/api/compte',c=(a,b)=>fetch(U,{method:'POST',body:JSON.stringify(Object.assign({a},b))}).then(r=>r.json()),id='wildkart-v7-ESSAI'+Date.now()%100000;(async()=>{const a=await c('sigreg',{id}),b=await c('sigsend',{id,msg:{k:'offer',from:'wkp-essai',cid:'1',sdp:'x'}}),d=await c('sigpoll',{id});await c('sigdel',{id});console.log(JSON.stringify({reg:a.ok,send:b.ok||b.code,recu:(d.msgs||[]).length}))})()" "$URL" || echo erreur)
          { echo "date: $(date -u)"; echo "url: $URL"; echo "ok: $OK"; cat turn.txt; echo "relais actif: $OK_ICE"; echo "mise en relation: $SIG"; echo "réponse:"; head -c 600 essai.txt; echo; echo "deploy:"; tail -15 deploy.log; } > "etat-$CIBLE.txt"
          cd ..; git config user.name "github-actions"; git config user.email "github-actions@users.noreply.github.com"
          git add "worker/url-$CIBLE.txt" "worker/etat-$CIBLE.txt"; git commit -m "Adresse du serveur $CIBLE [skip ci]" || true; for i in 1 2 3 4; do git pull --rebase && git push && break; sleep 5; done
          [ "$OK" = 1 ] || { echo "::error::Le serveur ne répond pas correctement"; exit 1; }
