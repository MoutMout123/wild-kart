<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Wild Kart</title>
<style>body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#17143a;color:#fffdf7;font:600 18px system-ui,sans-serif;text-align:center;padding:16px}a{color:#ffc531}</style>
</head><body><p>Wild Kart a déménagé…<br><a id="go" href="https://moutmout123.github.io/wild-kart-jeu/">Ouvrir le jeu</a></p>
<script>
// Wild Kart a déménagé : on emporte ce qui était enregistré ici (amis, code d'accès, kart…) vers la nouvelle adresse
(function () {
  var TO = 'https://moutmout123.github.io/wild-kart-jeu/', d = null, h = location.hash || '';
  try { d = localStorage.getItem('tiltkart.v1'); } catch (e) { /* rien */ }
  var imp = d ? '#import=' + encodeURIComponent(btoa(unescape(encodeURIComponent(d)))) : (/#import=/.test(h) ? h : '');
  try { if (navigator.serviceWorker) navigator.serviceWorker.getRegistrations().then(function (rs) { rs.forEach(function (r) { r.unregister(); }); }); } catch (e) { /* rien */ }
  var url = TO + (location.search || '') + imp; document.getElementById('go').href = url; setTimeout(function () { location.replace(url); }, 300);
})();
</script></body></html>
